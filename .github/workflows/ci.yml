name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q app tests
      - run: for file in static/*.js; do node --check "$file"; done
      - run: bash -n scripts/*.sh
      - run: cp .env.example .env && docker compose -f compose.yml config >/dev/null
      - run: mkdir -p data/media && alembic upgrade head
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bamboo-content-hub:test

  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clean install and healthcheck
        run: ./scripts/install.sh
      - name: Backup and restore round-trip
        run: |
          backup=$(./scripts/backup.sh | tail -n1)
          test -s "$backup"
          ./scripts/restore.sh "$backup"
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.yml logs --no-color bamboo || true
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yml down --remove-orphans || true
