name: Materialize publishing adapters

on:
  push:
    branches:
      - feat/complete-publishing-adapters
    paths:
      - ".adapter-transfer/**"
      - ".github/workflows/materialize-adapters.yml"

permissions:
  actions: write
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and materialize adapter sources
        shell: bash
        run: |
          set -euo pipefail

          cat .adapter-transfer/part-* > /tmp/changes.tar.gz.b64
          base64 --decode /tmp/changes.tar.gz.b64 > /tmp/changes.tar.gz
          echo "4bc41be46bcfecbe037e9ffd7ed7a41f35f046f35c3107ff8045fcdc45c1f8be  /tmp/changes.tar.gz" | sha256sum --check --strict -

          cat > /tmp/expected-files <<'EOF'
          app/integrations/service.py
          app/integrations/tiktok.py
          app/integrations/youtube.py
          app/main.py
          app/services.py
          docs/INTEGRATIONS.md
          static/app.css
          static/app.js
          templates/connections.html
          templates/product.html
          tests/test_api.py
          tests/test_tiktok_youtube.py
          EOF
          tar -tzf /tmp/changes.tar.gz | LC_ALL=C sort > /tmp/archive-files
          diff -u /tmp/expected-files /tmp/archive-files

          tar -xzf /tmp/changes.tar.gz -C .
          rm -rf .adapter-transfer .github/workflows/materialize-adapters.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only
          git commit -m "feat(integrations): complete TikTok and YouTube adapters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
