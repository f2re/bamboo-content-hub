services:
  bamboo:
    image: ${BAMBOO_IMAGE:-bamboo-content-hub:local}
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BAMBOO_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
