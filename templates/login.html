<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><link rel="stylesheet" href="/static/app.css"><title>Вход — Bamboo</title></head><body><main class="login-page"><section class="card login-card"><div class="brand"><span class="mark">B</span><span>Bamboo</span></div><h1>Вход</h1><p class="muted">Административный интерфейс защищён паролем.</p>{% if error %}<p class="error-text">{{error}}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="next" value="{{next_path}}"><label>Пароль<input name="password" type="password" autocomplete="current-password" required autofocus></label><button class="button primary full" type="submit">Войти</button></form></section></main></body></html>
